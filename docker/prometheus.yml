global:
  scrape_interval: 1s
  evaluation_interval: 1s
  external_labels:
    monitor: "monitor-redes2"
    aluno: "Raildom"
    matricula: "20239057601"

scrape_configs:
  #Auto-monitoramento do Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["76.1.0.30:9090"]

  #Exportador de Metricas do Nginx
  - job_name: "nginx"
    static_configs:
      - targets: ["76.1.0.10:9113"]
        labels:
          servidor: "nginx"
          tipo: "servidor_web"

  #Exportador de Metricas do Apache
  - job_name: "apache"
    static_configs:
      - targets: ["76.1.0.11:9117"]
        labels:
          servidor: "apache"
          tipo: "servidor_web"

  #Node Exporter do Nginx (métricas de sistema/processo)
  - job_name: "nginx-node"
    static_configs:
      - targets: ["76.1.0.10:9100"]
        labels:
          servidor: "nginx"
          tipo: "node_exporter"

  #Node Exporter do Apache (métricas de sistema/processo)
  - job_name: "apache-node"
    static_configs:
      - targets: ["76.1.0.11:9101"]
        labels:
          servidor: "apache"
          tipo: "node_exporter"